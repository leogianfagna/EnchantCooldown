plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	mavenCentral()
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	testImplementation platform("org.junit:junit-bom:5.10.3")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	
}

test {
	useJUnitPlatform()
}

def minecraftCompatibilityMatrix = [
	[version: '1.21', yarn: '1.21+build.9', fabricApi: '0.102.0+1.21'],
	[version: '1.21.1', yarn: '1.21.1+build.3', fabricApi: '0.116.12+1.21.1'],
	[version: '1.21.2', yarn: '1.21.2+build.1', fabricApi: '0.106.1+1.21.2'],
	[version: '1.21.3', yarn: '1.21.3+build.2', fabricApi: '0.114.1+1.21.3'],
	[version: '1.21.4', yarn: '1.21.4+build.8', fabricApi: '0.119.4+1.21.4'],
	[version: '1.21.5', yarn: '1.21.5+build.1', fabricApi: '0.128.2+1.21.5'],
	[version: '1.21.6', yarn: '1.21.6+build.1', fabricApi: '0.128.2+1.21.6'],
	[version: '1.21.7', yarn: '1.21.7+build.8', fabricApi: '0.129.0+1.21.7'],
	[version: '1.21.8', yarn: '1.21.8+build.1', fabricApi: '0.136.1+1.21.8'],
	[version: '1.21.9', yarn: '1.21.9+build.1', fabricApi: '0.134.1+1.21.9'],
	[version: '1.21.10', yarn: '1.21.10+build.3', fabricApi: '0.138.4+1.21.10'],
	[version: '1.21.11', yarn: '1.21.11+build.5', fabricApi: '0.141.4+1.21.11'],
]

tasks.register('compatibilityTest') {
	group = 'verification'
	description = 'Builds and tests the mod against every supported Minecraft 1.21.x version.'
	onlyIf {
		!providers.gradleProperty('skipCompatibilityMatrix').present
	}

	doLast {
		def isWindows = org.gradle.internal.os.OperatingSystem.current().isWindows()
		def wrapper = file(isWindows ? 'gradlew.bat' : 'gradlew').absolutePath
		minecraftCompatibilityMatrix.each { target ->
			logger.lifecycle("Validating Minecraft ${target.version} with Yarn ${target.yarn} and Fabric API ${target.fabricApi}")
			def command = [
					wrapper,
					'build',
					'--console=plain',
					'-PskipCompatibilityMatrix=true',
					'-Ploom_version=1.14.10',
					"-Pminecraft_version=${target.version}",
					"-Pyarn_mappings=${target.yarn}",
					"-Pfabric_version=${target.fabricApi}",
					'-Ploader_version=0.19.2'
			]
			if (isWindows) {
				command = ['cmd', '/c'] + command
			}
			command = command.collect { it.toString() }

			def process = new ProcessBuilder(command)
					.directory(projectDir)
					.inheritIO()
					.start()
			def exitCode = process.waitFor()
			if (exitCode != 0) {
				throw new GradleException("Compatibility test failed for Minecraft ${target.version} with exit code ${exitCode}")
			}
		}
	}
}

test.dependsOn tasks.named('compatibilityTest')

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
