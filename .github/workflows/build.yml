# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on:
  push:
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'gradle/**'
  pull_request:
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'gradle/**'

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        minecraft:
          - version: '1.21'
            yarn: '1.21+build.9'
            fabric_api: '0.102.0+1.21'
          - version: '1.21.1'
            yarn: '1.21.1+build.3'
            fabric_api: '0.116.12+1.21.1'
          - version: '1.21.2'
            yarn: '1.21.2+build.1'
            fabric_api: '0.106.1+1.21.2'
          - version: '1.21.3'
            yarn: '1.21.3+build.2'
            fabric_api: '0.114.1+1.21.3'
          - version: '1.21.4'
            yarn: '1.21.4+build.8'
            fabric_api: '0.119.4+1.21.4'
          - version: '1.21.5'
            yarn: '1.21.5+build.1'
            fabric_api: '0.128.2+1.21.5'
          - version: '1.21.6'
            yarn: '1.21.6+build.1'
            fabric_api: '0.128.2+1.21.6'
          - version: '1.21.7'
            yarn: '1.21.7+build.8'
            fabric_api: '0.129.0+1.21.7'
          - version: '1.21.8'
            yarn: '1.21.8+build.1'
            fabric_api: '0.136.1+1.21.8'
          - version: '1.21.9'
            yarn: '1.21.9+build.1'
            fabric_api: '0.134.1+1.21.9'
          - version: '1.21.10'
            yarn: '1.21.10+build.3'
            fabric_api: '0.138.4+1.21.10'
          - version: '1.21.11'
            yarn: '1.21.11+build.5'
            fabric_api: '0.141.4+1.21.11'
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: >
          ./gradlew build
          -PskipCompatibilityMatrix=true
          -Pminecraft_version=${{ matrix.minecraft.version }}
          -Pyarn_mappings=${{ matrix.minecraft.yarn }}
          -Pfabric_version=${{ matrix.minecraft.fabric_api }}
          -Ploader_version=0.19.2
          -Ploom_version=1.14.10
        
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts-${{ matrix.minecraft.version }}
          path: build/libs/
