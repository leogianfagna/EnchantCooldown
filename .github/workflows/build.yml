# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on:
  push:
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'gradle/**'
  pull_request:
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'gradle/**'

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        minecraft:
          - version: '1.21.1'
            yarn: '1.21.1+build.3'
            fabric_api: '0.116.4+1.21.1'
            loader: '0.16.14'
            loom: '1.11-SNAPSHOT'
          - version: '1.21.11'
            yarn: '1.21.11+build.3'
            fabric_api: '0.141.4+1.21.11'
            loader: '0.19.2'
            loom: '1.14.10'
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: >
          ./gradlew build
          -Pminecraft_version=${{ matrix.minecraft.version }}
          -Pyarn_mappings=${{ matrix.minecraft.yarn }}
          -Pfabric_version=${{ matrix.minecraft.fabric_api }}
          -Ploader_version=${{ matrix.minecraft.loader }}
          -Ploom_version=${{ matrix.minecraft.loom }}
        
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
